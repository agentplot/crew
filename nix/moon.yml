$schema: 'https://moonrepo.dev/schemas/project.json'

# crew's flake: flake.nix and flake.lock at the root, everything else of it under nix/ (record 0058, flake.3). Each
# check is one task, tagged check-full, so tests/suite and sluice run it beside crew's suite (tests.5), run from the
# workspace root by the tools crew's devenv shell carries. None builds: the type check and the test evaluate the flake
# offline and read-only against no store, with the inputs the shell fetched (nix/check.sh).
language: 'nix'

tasks:
  # nixfmt over the flake's own files.
  format:
    script: 'nixfmt --check flake.nix $(find nix -name "*.nix" | sort)'
    inputs: ['/flake.nix', '/nix/**/*', '/devenv.nix', '/devenv.yaml', '/devenv.lock']
    tags: [check-full]
    options: {runFromWorkspaceRoot: true}
  # statix and deadnix over the flake's own files.
  lint:
    script: 'statix check flake.nix && statix check nix && deadnix --fail flake.nix nix'
    inputs: ['/flake.nix', '/nix/**/*', '/devenv.nix', '/devenv.yaml', '/devenv.lock']
    tags: [check-full]
    options: {runFromWorkspaceRoot: true}
  # Every package of every system evaluates, and each module in a system of its platform. crew.py is among its inputs
  # since the module reads its version from it, and plugin/release.json since the package's version is the one it gives;
  # the package's other files move its path but no case's outcome.
  typecheck:
    command: 'sh nix/check.sh typecheck'
    inputs: ['/flake.nix', '/flake.lock', '/nix/**/*', '/devenv.nix', '/devenv.yaml', '/devenv.lock', '/plugin/lib/crew.py', '/plugin/release.json']
    tags: [check-full]
    options: {runFromWorkspaceRoot: true}
  # The cases of the crew-flake spec under nix/tests: the file pinned byte for byte, the package's version from
  # plugin/release.json and its release, each module's activation and assertions, and the activation script's own cases.
  test:
    command: 'sh nix/check.sh test'
    inputs: ['/flake.nix', '/flake.lock', '/nix/**/*', '/devenv.nix', '/devenv.yaml', '/devenv.lock', '/plugin/lib/crew.py', '/plugin/release.json']
    tags: [check-full]
    options: {runFromWorkspaceRoot: true}
